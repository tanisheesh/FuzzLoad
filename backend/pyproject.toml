[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzload"
version = "1.0.0"
description = "FuzzLoad Adaptive Load Balancer SDK & Soft-Computing AI Control Plane (5-Layer ANFIS + Genetic Programming)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
fuzzload = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "fuzzload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
