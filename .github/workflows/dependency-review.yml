# ║  Goes to: <repo>/.github/workflows/dependency-review.yml             ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    if: github.event.repository.private == false || vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only
          show-patched-versions: true
          comment-summary-in-pr: on-failure

