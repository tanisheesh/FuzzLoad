# ║  Auto-labels PRs from .github/labeler.yml.                           ║
# ║  Goes to: <repo>/.github/workflows/labeler.yml                       ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Uses pull_request_target WITHOUT checking out PR code, so fork PRs are
# safe and still receive labels.

name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false

