name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 5 * * 1"   # Monday 05:15 UTC = 10:45 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-languages:
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      has_languages: ${{ steps.detect.outputs.has_languages }}
      go_mod_file: ${{ steps.detect.outputs.go_mod_file }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect CodeQL languages
        id: detect
        run: |
          langs=()
          go_mod_file=""
          if find . \( -name node_modules -o -name .git -o -name dist -o -name .next -o -name .venv -o -name venv \) -prune -o \
            -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' \) -print -quit | grep -q .; then
            langs+=('"javascript-typescript"')
          fi
          if find . \( -name .venv -o -name venv -o -name .git -o -name node_modules \) -prune -o \
            -type f -name '*.py' -print -quit | grep -q .; then
            langs+=('"python"')
          fi
          if find . \( -name vendor -o -name .git -o -name node_modules \) -prune -o \
            -type f -name '*.go' -print -quit | grep -q .; then
            langs+=('"go"')
            go_mod_file=$(find . -maxdepth 3 -name go.mod -not -path '*/vendor/*' -print -quit || true)
          fi

          if [ "${#langs[@]}" -eq 0 ]; then
            {
              echo "has_languages=false"
              echo "languages=[]"
            } >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "[${langs[*]}]")
            {
              echo "has_languages=true"
              echo "languages=$joined"
              echo "go_mod_file=$go_mod_file"
            } >> "$GITHUB_OUTPUT"
            echo "Detected CodeQL languages: $joined"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    if: needs.detect-languages.outputs.has_languages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go' && needs.detect-languages.outputs.go_mod_file != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ needs.detect-languages.outputs.go_mod_file }}
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

