# ║  Gitleaks secret scanning on pushes & PRs (full commit range).       ║
# ║  Goes to: <repo>/.github/workflows/secret-scan.yml                   ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full repository / PR commit range with Gitleaks CLI
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          GITLEAKS_VER="8.24.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            echo "Scanning full PR range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            /tmp/gitleaks git --config .gitleaks.toml --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" --redact --verbose .
          else
            echo "Scanning full git history on push/dispatch"
            /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .
          fi

