# ╔══════════════════════════════════════════════════════════════════════╗
# ║  TANISH'S SETUP TOOLKIT · tanisheesh.in                              ║
# ║  Weekly maintenance report, emailed to you.                          ║
# ║  Goes to: <repo>/.github/workflows/maintenance-report.yml            ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Every Monday 10:00 IST (after Renovate + auto-merge + CodeQL) this emails:
#   • dependency updates merged automatically this period
#   • update PRs still open / needing review (CI failed, or major held back)
#   • open Dependabot security alerts (if ALERTS_TOKEN is set)
#   • open CodeQL code-scanning alerts & Secret Scanning alerts (if enabled)
#   • latest CI result on main
# The same report is also shown on the workflow run's Summary page.
#
# One-time setup (per repo, or once per account with `gh secret set --user`):
#   MAIL_USERNAME   repo secret. The Gmail address that sends the mail
#   MAIL_PASSWORD   repo secret. A Gmail App Password (myaccount.google.com/apppasswords),
#                   NOT your normal password. Needs 2-step verification on.
#   REPORT_EMAIL    repo *variable*. Recipient email address (required to send email).
#   ALERTS_TOKEN    optional secret. Fine-grained PAT with read access to
#                   Dependabot alerts, Code scanning alerts, and Secret scanning alerts.
# scripts/setup-github-repo.ps1 sets these for you from the toolkit's .env file.
#
# Monthly instead of weekly: cron → "30 4 1 * *" and PERIOD_DAYS → "30".

name: Maintenance report

on:
  schedule:
    - cron: "30 4 * * 1"   # Monday 04:30 UTC = 10:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read

env:
  PERIOD_DAYS: "7"

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && vars.REPORT_EMAIL != '' }}
    steps:
      - name: Build report
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          since=$(date -u -d "$PERIOD_DAYS days ago" +%Y-%m-%d)
          today=$(date -u +%Y-%m-%d)
          bot_author="${BOT_USERNAME:-app/dependabot}"

          merged=$(gh pr list -R "$REPO" --state merged --limit 100 \
            --search "author:$bot_author merged:>=$since" \
            --json number,title,url 2>/dev/null || echo '[]')
          open=$(gh pr list -R "$REPO" --state open --author "$bot_author" --limit 100 \
            --json number,title,url,labels 2>/dev/null || echo '[]')
          ci=$(gh run list -R "$REPO" --workflow ci.yml --branch main --limit 1 \
            --json conclusion,status,url,createdAt 2>/dev/null || echo '[]')

          sec_token="${ALERTS_TOKEN:-$GH_TOKEN}"

          alerts='[]'; alerts_ok=false
          if [ -n "${ALERTS_TOKEN:-}" ]; then
            if a=$(GH_TOKEN="$ALERTS_TOKEN" gh api --paginate --slurp "repos/$REPO/dependabot/alerts?state=open&per_page=100" 2>/dev/null); then
              alerts=$(jq -c 'add // []' <<<"$a")
              alerts_ok=true
            fi
          fi

          code_alerts='[]'; code_alerts_ok=false
          if ca=$(GH_TOKEN="$sec_token" gh api --paginate --slurp "repos/$REPO/code-scanning/alerts?state=open&per_page=100" 2>/dev/null); then
            code_alerts=$(jq -c 'add // []' <<<"$ca")
            code_alerts_ok=true
          fi

          secret_alerts='[]'; secret_alerts_ok=false
          if sa=$(GH_TOKEN="$sec_token" gh api --paginate --slurp "repos/$REPO/secret-scanning/alerts?state=open&per_page=100" 2>/dev/null); then
            secret_alerts=$(jq -c 'add // []' <<<"$sa")
            secret_alerts_ok=true
          fi

          n_merged=$(jq length <<<"$merged")
          n_open=$(jq length <<<"$open")
          n_alerts=$(jq length <<<"$alerts")
          n_code_alerts=$(jq length <<<"$code_alerts")
          n_secret_alerts=$(jq length <<<"$secret_alerts")
          ci_state=$(jq -r '.[0] | if . == null then "no runs" elif .status != "completed" then .status else .conclusion end' <<<"$ci")
          ci_url=$(jq -r '.[0].url // ""' <<<"$ci")

          case "$ci_state" in success) ci_badge="✅ passing";; failure) ci_badge="❌ failing";; *) ci_badge="⚪ $ci_state";; esac

          alerts_failed=false
          if [ -n "${ALERTS_TOKEN:-}" ] && [ "$alerts_ok" = false ]; then
            alerts_failed=true
          fi

          if [ "$n_open" -gt 0 ] || [ "$n_alerts" -gt 0 ] || [ "$n_code_alerts" -gt 0 ] || [ "$n_secret_alerts" -gt 0 ] || [ "$ci_state" = failure ] || [ "$alerts_failed" = true ]; then
            headline="⚠️ Needs your attention"
          elif [ "$code_alerts_ok" = false ] || [ "$secret_alerts_ok" = false ] || [ "$alerts_ok" = false ]; then
            headline="ℹ️ Passing (some security scans unavailable)"
          else
            headline="✅ All good. Nothing to do"
          fi

          li_merged=$(jq -r '.[] | "<li><a href=\"\(.url)\">#\(.number)</a> \(.title | @html)</li>"' <<<"$merged")
          li_open=$(jq -r '.[] | "<li><a href=\"\(.url)\">#\(.number)</a> \(.title | @html)\(if any(.labels[]; .name == "needs-review") then " <b style=\"color:#d93f0b\">needs review</b>" else "" end)</li>"' <<<"$open")
          li_alerts=$(jq -r '.[] | "<li><b>\(.security_advisory.severity | ascii_upcase)</b> · \(.dependency.package.name | @html): \(.security_advisory.summary | @html) · <a href=\"\(.html_url)\">view</a></li>"' <<<"$alerts")
          li_code=$(jq -r '.[] | "<li><b>\(.rule.security_severity_level // .rule.severity | ascii_upcase)</b> · \(.rule.id | @html): \(.rule.description | @html) · <a href=\"\(.html_url)\">view</a></li>"' <<<"$code_alerts")
          li_secret=$(jq -r '.[] | "<li><b>\(.secret_type_display_name | @html)</b> · <a href=\"\(.html_url)\">view</a></li>"' <<<"$secret_alerts")

          section() {  # title, count, items, empty-text
            echo "<h3 style=\"margin:24px 0 8px;font-size:15px\">$1 <span style=\"color:#888;font-weight:normal\">($2)</span></h3>"
            if [ "$2" -gt 0 ]; then echo "<ul style=\"margin:0;padding-left:20px;line-height:1.7\">$3</ul>"
            else echo "<p style=\"margin:0;color:#888\">$4</p>"; fi
          }

          {
            echo "<div style=\"font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:auto;color:#111\">"
            echo "<p style=\"font-size:11px;letter-spacing:1px;color:#888;margin:0\">TANISH'S SETUP TOOLKIT · MAINTENANCE REPORT</p>"
            echo "<h2 style=\"margin:4px 0\"><a href=\"https://github.com/$REPO\" style=\"color:#111;text-decoration:none\">$REPO</a></h2>"
            echo "<p style=\"margin:0 0 16px;color:#555\">$since → $today</p>"
            echo "<p style=\"font-size:17px;margin:0 0 8px\"><b>$headline</b></p>"
            echo "<table style=\"border-collapse:collapse;font-size:14px\">"
            echo "<tr><td style=\"padding:4px 16px 4px 0\">Auto-merged updates</td><td><b>$n_merged</b></td></tr>"
            echo "<tr><td style=\"padding:4px 16px 4px 0\">Open update PRs</td><td><b>$n_open</b></td></tr>"
            if $alerts_ok; then
              echo "<tr><td style=\"padding:4px 16px 4px 0\">Dependabot alerts</td><td><b>$n_alerts</b></td></tr>"
            elif $alerts_failed; then
              echo "<tr><td style=\"padding:4px 16px 4px 0\">Dependabot alerts</td><td><b style=\"color:#d93f0b\">unavailable (query failed)</b></td></tr>"
            else
              echo "<tr><td style=\"padding:4px 16px 4px 0\">Dependabot alerts</td><td><span style=\"color:#888\">unavailable (ALERTS_TOKEN unset)</span></td></tr>"
            fi
            if $code_alerts_ok; then
              echo "<tr><td style=\"padding:4px 16px 4px 0\">CodeQL alerts</td><td><b>$n_code_alerts</b></td></tr>"
            else
              echo "<tr><td style=\"padding:4px 16px 4px 0\">CodeQL alerts</td><td><span style=\"color:#888\">unavailable</span></td></tr>"
            fi
            if $secret_alerts_ok; then
              echo "<tr><td style=\"padding:4px 16px 4px 0\">Secret alerts</td><td><b>$n_secret_alerts</b></td></tr>"
            else
              echo "<tr><td style=\"padding:4px 16px 4px 0\">Secret alerts</td><td><span style=\"color:#888\">unavailable</span></td></tr>"
            fi
            echo "<tr><td style=\"padding:4px 16px 4px 0\">CI on main</td><td><b>${ci_url:+<a href=\"$ci_url\">}$ci_badge${ci_url:+</a>}</b></td></tr>"
            echo "</table>"
            section "✅ Merged automatically" "$n_merged" "$li_merged" "No dependency updates merged this period."
            section "⏳ Waiting on you" "$n_open" "$li_open" "No open update PRs."
            if $alerts_ok; then
              section "📦 Dependabot alerts" "$n_alerts" "$li_alerts" "No open dependency alerts."
            elif $alerts_failed; then
              echo "<p style=\"margin:24px 0 0;color:#d93f0b;font-size:13px\">📦 Dependabot alerts query failed — check ALERTS_TOKEN permissions or Dependabot alert status.</p>"
            else
              echo "<p style=\"margin:24px 0 0;color:#888;font-size:13px\">📦 Dependabot alerts unavailable (add an ALERTS_TOKEN secret to enable).</p>"
            fi
            if $code_alerts_ok; then
              section "🛡️ CodeQL alerts" "$n_code_alerts" "$li_code" "No open CodeQL findings."
            else
              echo "<p style=\"margin:16px 0 0;color:#888;font-size:13px\">🛡️ CodeQL alerts unavailable (Code scanning disabled or missing permissions).</p>"
            fi
            if $secret_alerts_ok; then
              section "🔑 Secret scanning alerts" "$n_secret_alerts" "$li_secret" "No exposed secrets detected."
            else
              echo "<p style=\"margin:16px 0 0;color:#888;font-size:13px\">🔑 Secret scanning alerts unavailable (Secret scanning disabled or missing ALERTS_TOKEN scope).</p>"
            fi
            echo "<hr style=\"border:none;border-top:1px solid #eee;margin:28px 0 12px\">"
            echo "<p style=\"font-size:12px;color:#888;margin:0\">Tanish Poddar · <a href=\"https://tanisheesh.in\">tanisheesh.in</a> · <a href=\"https://github.com/tanisheesh\">GitHub</a> · <a href=\"https://linkedin.com/in/tanisheesh\">LinkedIn</a> · <a href=\"mailto:hi@tanisheesh.in\">hi@tanisheesh.in</a></p>"
            echo "</div>"
          } > report.html

          cat report.html >> "$GITHUB_STEP_SUMMARY"
          echo "subject=📦 ${REPO#*/} · $n_merged merged · $n_open open · CI $ci_state" >> "$GITHUB_OUTPUT"

      - name: Email report
        if: env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Setup Toolkit <${{ secrets.MAIL_USERNAME }}>
          to: ${{ vars.REPORT_EMAIL }}
          subject: ${{ steps.build.outputs.subject }}
          html_body: file://report.html

      - name: Note when email is not configured
        if: env.HAS_MAIL != 'true'
        run: echo "::warning::MAIL_USERNAME, MAIL_PASSWORD, or REPORT_EMAIL not configured. Report is on the Summary page only, no email sent."

